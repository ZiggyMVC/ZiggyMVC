name: Ziggy MVC Tests

on:
  push:
    branches: [ "main", "qa" ]
  pull_request:
    branches: [ "main", "qa" ]

jobs:
  test:
    strategy:
      matrix:
        engine: [ lucee@7, adobe@2023, adobe@2021, adobe@2018 ]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Install the ortus security key
      run: curl -fsSl https://downloads.ortussolutions.com/debs/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/ortussolutions.gpg > /dev/null

    - name: Add the commandbox source
      run: echo "deb [signed-by=/usr/share/keyrings/ortussolutions.gpg] https://downloads.ortussolutions.com/debs/noarch /" | sudo tee /etc/apt/sources.list.d/commandbox.list

    - name: Update apt and install commandbox
      run: sudo apt-get update && sudo apt-get install apt-transport-https commandbox

    - name: Install dependencies
      run: box install

    - name: Start the ${{ matrix.engine }} CFML engine
      run: box server start cfengine=${{ matrix.engine }} port=8500 openbrowser=false
    
    - name: Run tests
      run: |
        # Fetch test results directly (ignoring HTTP status code from old TestBox)
        RESULTS=$(curl -s "http://localhost:8500/tests/runner.cfm?recurse=true&reporter=json")
        echo "$RESULTS" | jq .

        # Check for failures or errors in the JSON response
        TOTAL_FAIL=$(echo "$RESULTS" | jq '.totalFail')
        TOTAL_ERROR=$(echo "$RESULTS" | jq '.totalError')

        echo "Total Failures: $TOTAL_FAIL"
        echo "Total Errors: $TOTAL_ERROR"

        if [ "$TOTAL_FAIL" != "0" ] || [ "$TOTAL_ERROR" != "0" ]; then
          echo "Tests failed!"
          exit 1
        fi

        echo "All tests passed!"
